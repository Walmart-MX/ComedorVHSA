<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes del Comedor - Walmart CEDIS</title>
<meta http-equiv="refresh" content="0; url=./app/">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f2f5fa;color:#0f1f3d;
       min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  a{color:#0071CE;font-weight:700;}
</style>
</head>
<body>
  <div>
    <p>Redirigiendo al formulario de reportes del comedor...</p>
    <p><a href="./app/">Haz clic aquí si no te redirige automáticamente</a></p>
  </div>
  <script>
    // Esta URL (la raíz del sitio) ya NO es una app en sí misma -- desde la
    // separación en /app/ (formulario) y /admin/ (panel administrativo), ver
    // README.md. Si un visitante trae instalado el Service Worker viejo que
    // vivía aquí, lo damos de baja para que la redirección nunca quede
    // atrapada sirviendo una versión cacheada de la página anterior.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((reg) => reg.unregister());
      });
    }
    window.location.replace('./app/');
  </script>
</body>
</html>
